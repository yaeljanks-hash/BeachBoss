<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#172c3a">
  <title>Beach Boss</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #172c3a;
      /* Stop the browser from scrolling, zooming or bouncing on touch */
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #172c3a;
      color: #ffffff;
      font: bold 20px sans-serif;
      text-align: center;
    }
    /* The game is designed for landscape; ask phone players to rotate */
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate-hint {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate-hint">Please rotate your phone to landscape to play Beach Boss</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
